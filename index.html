<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Enhanced City Quiz</h1>
    
    </header>
    <main>
        <class="quiz-container">
            <h2>Test Your Knowledge of Cities!</h2>
            <p>Answer the following questions to see how well you know the world's cities.</p>
            <form id="quiz-form">
                <div class="question">
                    <label for="q1">1. What is the capital of France?</label>
                    <input type="text" id="q1" name="q1" required>
                </div>
                <div class="question">
                    <label for="q2">2. Which city is known as the "Big Apple"?</label>
                    <input type="text" id="q2" name="q2" required>
                </div>
                <div class="question">
                    <label for="q3">3. What city is famous for its canals and gondolas?</label>
                    <input type="text" id="q3" name="q3" required>
                </div>
                <button type="submit">Submit Answers</button>
            </form>
        </main>

    <footer>
        <p>Noahs Quiz</p>  
        </footer>
</body>
</html>
